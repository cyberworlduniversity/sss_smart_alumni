<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College College Smart Alumni - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/dark-mode.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fb}
.login-shell{width:100%;max-width:430px;padding:20px}.login-card{border:0;border-radius:18px;overflow:hidden}
.login-brand{font-weight:800;letter-spacing:.2px}
</style>
</head>
<body>
<div class="login-shell">
<div class="text-center mb-4"><h1 class="login-brand">College Smart Alumni</h1><p class="text-muted mb-0">College Smart Alumni and Network Management System</p></div>
<div class="card shadow login-card"><div class="card-body p-4 p-md-5">
<h3 class="text-center mb-4">Welcome Back</h3>
<div id="loginNotice" class="alert alert-warning d-none" role="alert">The Netlify frontend is working. Connect your Django backend URL to enable login.</div>
<form id="loginForm">
<div class="mb-3"><label for="username" class="form-label">Username</label><input id="username" name="username" type="text" class="form-control" placeholder="Enter username" autocomplete="username" required autofocus></div>
<div class="mb-2"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required></div>
<div class="text-end mb-4"><a href="#" id="forgotLink" class="text-decoration-none">Forgot Password?</a></div>
<button type="submit" class="btn btn-primary w-100 py-2">Login</button>
</form>
<p class="text-center text-muted mt-4 mb-0">Don't have an account? <a href="#" id="registerLink" class="text-decoration-none fw-semibold">Register</a></p>
</div></div></div>
<script>
const BACKEND_URL = "http://127.0.0.1:8000/"; // Set this to your deployed Django URL, e.g. https://your-backend.example.com
function backendRequired(e){e.preventDefault();document.getElementById('loginNotice').classList.remove('d-none');}
document.getElementById('loginForm').addEventListener('submit', backendRequired);
document.getElementById('forgotLink').addEventListener('click', backendRequired);
document.getElementById('registerLink').addEventListener('click', backendRequired);
</script>
</body></html>
