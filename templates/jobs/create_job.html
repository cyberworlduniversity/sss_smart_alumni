{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow-sm">

                <div class="card-header">
                    <h3 class="mb-0">Post Job Vacancy</h3>
                </div>

                <div class="card-body">

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Job Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="e.g. Python Developer"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Company
                            </label>

                            <input
                                type="text"
                                name="company"
                                class="form-control"
                                placeholder="Company name"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                placeholder="e.g. Chennai / Remote"
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Job Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="7"
                                placeholder="Enter job description..."
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Post Job
                        </button>

                        <a
                            href="{% url 'jobs:job_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
